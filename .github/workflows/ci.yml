name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
      - name: Verify module checksums
        run: go mod verify
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt would reformat the following files:$out"
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout 5m
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: '1.25.12'
          - os: ubuntu-latest
            go: '1.26.5'
          - os: windows-latest
            go: '1.25.12'
          - os: windows-latest
            go: '1.26.5'
          - os: macos-latest
            go: '1.26.5'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
      - run: go test -race ./...

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the checked-out composite Action
        uses: ./
        with:
          directory: ./examples/basic

  dogfood:
    needs: [lint, test, race, action-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
      - name: build
        run: go build -o tofulock .
      - name: list (self-dogfood)
        run: ./tofulock list ./examples/basic
      - name: verify example modules - text + json
        run: |
          ./tofulock verify ./examples/basic
          ./tofulock verify --json ./examples/basic > verify.json
          head -5 verify.json
      - name: lock --json
        run: ./tofulock lock --json ./examples/basic > lock.json
      - name: attest + verify-attest
        run: |
          ./tofulock keygen --out ci
          ./tofulock attest ./examples/basic --key ci.key --out ci.dsse.json --approved-by ci@tofulock
          ./tofulock verify-attest ./examples/basic --key ci.pub --att ci.dsse.json
      - name: verify terragrunt example
        run: ./tofulock verify ./examples/terragrunt
      - name: verify opentofu example
        run: ./tofulock verify ./examples/opentofu --registry-host registry.opentofu.org
