# Conservative golangci-lint v2 config: a small set of correctness-oriented
# analyzers. Additions are deliberate rather than inherited from a broad preset.
version: "2"

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    govet:
      enable-all: false
    staticcheck:
      # ST1000 is too noisy for this internal-package layout.
      checks: ["all", "-ST1000"]

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
