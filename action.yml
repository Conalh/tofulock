name: 'tofulock verify'
description: 'Fail the build if any locked Terraform/OpenTofu module has drifted from its pinned commit.'
branding:
  icon: 'lock'
  color: 'purple'
inputs:
  directory:
    description: 'Directory containing the module config and .tofulock.lock.json'
    required: false
    default: '.'
  json:
    description: 'Emit machine-readable JSON output'
    required: false
    default: 'false'
  registry-host:
    description: 'Registry for bare module addresses; OpenTofu users typically choose registry.opentofu.org'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version: '1.26.5'
        cache-dependency-path: ${{ github.action_path }}/go.sum
    - name: Build the pinned Action source
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        bin_dir="${RUNNER_TEMP//\\//}/tofulock-action"
        mkdir -p "$bin_dir"
        bin="$bin_dir/tofulock"
        if [ "$RUNNER_OS" = "Windows" ]; then
          bin="$bin.exe"
        fi
        go build -trimpath -o "$bin" .
        echo "TOFULOCK_BIN=$bin" >> "$GITHUB_ENV"
    - name: Verify module integrity
      shell: bash
      env:
        TOFULOCK_DIR: ${{ inputs.directory }}
        TOFULOCK_JSON: ${{ inputs.json }}
        TOFULOCK_REGISTRY_HOST: ${{ inputs.registry-host }}
      run: |
        if [ "$TOFULOCK_JSON" = "true" ]; then
          "$TOFULOCK_BIN" verify "$TOFULOCK_DIR" --json
        else
          "$TOFULOCK_BIN" verify "$TOFULOCK_DIR"
        fi
